[pytest]
# Anchor the pytest rootdir at tests/validation so the repo-level tests/conftest.py
# (TF-era: imports tensorflow + gigalens.tf.* + the removed gigalens.model.PhysicalModel)
# is NOT collected for this suite. With this file present, `pytest tests/validation`
# from the repo root resolves rootdir here and loads only tests/validation/conftest.py.
addopts = -ra
testpaths = .

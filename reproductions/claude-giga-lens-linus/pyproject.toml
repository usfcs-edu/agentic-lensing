[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cgl2"
version = "0.1.0"
description = "claude-giga-lens-linus campaign package (scene-API bridge: correlated likelihood, MC-SMC evidence, profile fork)"
requires-python = ">=3.12"
# Deliberately no dependencies: the venv is pinned via constraints.txt and the vendored
# gigalens-linus is installed --no-deps (see plans/PLAN.md §3).
dependencies = []

[tool.setuptools]
packages = ["cgl2", "cgl2.samplers"]

[tool.pytest.ini_options]
testpaths = ["tests"]

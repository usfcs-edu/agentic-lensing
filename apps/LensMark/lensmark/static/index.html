<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>LensMark</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%23f2f2f2' stroke-width='2' stroke-dasharray='0 5' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23ffb347'/%3E%3C/svg%3E" />
    <script type="module" crossorigin src="/assets/index-j_JGn532.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-C5AOL9jv.css">
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <span class="brand">LensMark</span>
        <span id="campaign-name" class="campaign"></span>
        <span class="spacer"></span>
        <label class="reviewer">reviewer <input id="reviewer" data-testid="reviewer" type="text" size="10" spellcheck="false" /></label>
        <span id="health" class="health"></span>
      </header>

      <aside id="left">
        <div id="image-list" role="list"></div>
      </aside>

      <main id="centre">
        <div id="toolbar"></div>
        <div id="draft-bar" class="draft-bar" hidden></div>
        <div id="stage-wrap" data-tool="select">
          <div id="stage">
            <img id="base" alt="" draggable="false" />
            <svg id="overlay" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1 1"></svg>
          </div>
          <div id="text-prompt" class="text-prompt" hidden>
            <input type="text" data-testid="text-input" placeholder="text note — Enter to place, Esc to cancel" spellcheck="false" />
          </div>
        </div>
        <div id="statusbar"></div>
      </main>

      <aside id="right">
        <nav id="tabs"></nav>
        <section id="panel-items" data-panel="items"></section>
        <section id="panel-system" data-panel="system" hidden></section>
        <section id="panel-propose" data-panel="propose" hidden></section>
        <section id="panel-review" data-panel="review" hidden></section>
        <section id="panel-voice" data-panel="voice" hidden></section>
        <section id="panel-export" data-panel="export" hidden></section>
      </aside>

      <div id="toasts" aria-live="polite"></div>
    </div>
  </body>
</html>

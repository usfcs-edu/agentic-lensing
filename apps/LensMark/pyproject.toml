[project]
name = "lensmark"
version = "0.1.0"
description = "LensMark - expert annotation of strong-lens cutouts (arrows, masks, Einstein rings) with Claude proposals and critique data"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.5",
    "pillow==12.2.0",
    "numpy",
    "pandas",
    "pyarrow",
    "claude-agent-sdk>=0.2.148",
    "python-multipart",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx", "anyio"]
voice = ["mlx-whisper"]

[project.scripts]
lensmark = "lensmark.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lensmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

name: LensJudge no-Claude CI

# Phase F (v5): the open-weight backend is LensJudge's default engine. This job runs the
# test suite in an environment with NO anthropic and NO claude-agent-sdk installed, so any
# change that reintroduces a hard Claude dependency on the default path fails CI. The
# Claude engine remains a supported, explicitly-selected option (LENSJUDGE_BACKEND=claude);
# its guarded imports are exactly what this environment exercises.

on:
  push:
    paths:
      - 'reproductions/lensjudge/**'
      - '.github/workflows/lensjudge-ci.yml'
  pull_request:
    paths:
      - 'reproductions/lensjudge/**'
      - '.github/workflows/lensjudge-ci.yml'
  workflow_dispatch:

jobs:
  test-claude-free:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # Deliberately minimal: no anthropic, no claude-agent-sdk, no torch, no GPU.
      - name: Install open-path dependencies only
        run: |
          python -m pip install -U pip
          pip install pytest numpy pandas pyarrow pillow astropy scipy requests scikit-learn pydantic

      - name: Assert Claude packages are absent
        run: |
          ! python -c "import anthropic" 2>/dev/null
          ! python -c "import claude_agent_sdk" 2>/dev/null

      - name: Run LensJudge test suite (Claude-free)
        env:
          PYTHONPATH: ${{ github.workspace }}/reproductions
        run: pytest reproductions/lensjudge/tests -v

site_name: Agentic Lensing
site_description: >-
  Agentic reproductions of the Huang-group strong-lensing corpus,
  plus current work: LensJudge, ClaudeNet, and Redshifty.
site_author: Greg Benson
site_url: https://usfcs-edu.github.io/agentic-lensing/

repo_url: https://github.com/usfcs-edu/agentic-lensing
repo_name: usfcs-edu/agentic-lensing

# "site" is this project's directory name, so the build output gets an
# explicit, distinct name (resolved relative to this file -> site/_site/).
site_dir: _site

theme:
  name: material
  custom_dir: overrides
  logo: assets/images/logo.png
  favicon: assets/images/logo.png

  palette:
    # Light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  features:
    # NOTE: navigation.indexes is deliberately OFF — every report page is a
    # <slug>/index.md, and the feature would adopt the first one as each
    # section's landing page (clicking "Current" would open LensJudge and
    # remove it from the child list). Sections should only expand/collapse.
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    # NOTE: deliberately no toc.integrate — keeps the right-side page TOC.

validation:
  links:
    anchors: warn

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.arithmatex:
      generic: true
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
      toc_depth: 3

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

# Pages under current/, reproductions/, and other/apple-silicon/<slug>.md are
# GENERATED by site/build_reports.py (run it before `mkdocs build --strict`
# or `mkdocs serve`); they are gitignored and built in CI.
nav:
  - Home: index.md
  # Prerequisite material: what you read BEFORE the reports, so it sits first.
  # navigation.indexes is OFF (see the theme block), so "Overview" must be an
  # explicit first child — the section will not adopt index.md by itself.
  # The nested "Part N" entries are pure grouping and need no index page.
  - Guide:
      - Overview: guide/index.md
      - "Part 0 — Orientation":
          - "1. What this repository does": guide/01-orientation.md
      - "Part I — The mathematical spine":
          - "2. Derivatives & linearization": guide/02-derivatives.md
          - "3. Integrals & projection": guide/03-integrals.md
          - "4. Jacobians, Hessians, det J": guide/04-multivariable.md
          - "5. Eigenvalues, saddles, conditioning": guide/05-linear-algebra.md
          - "6. Vector calculus & Green's functions": guide/06-vector-calculus.md
          - "7. Fourier, power spectra & whitening": guide/07-fourier.md
          - "8. Likelihood, evidence & the nat": guide/08-probability.md
      - "Part II — The physical universe":
          - "9. Units of the sky": guide/09-units.md
          - "10. Galaxies & velocity dispersion": guide/10-galaxies.md
          - "11. PSF, noise & drizzle": guide/11-observation.md
          - "12. Redshifts & spectra": guide/12-spectroscopy.md
      - "Part III — Cosmology":
          - "13. The expanding universe": guide/13-expansion.md
          - "14. FRW & Friedmann": guide/14-frw.md
          - "15. Distances & Σ_crit": guide/15-distances.md
      - "Part IV — Gravitational lensing":
          - "16. Deflection & the factor of two": guide/16-deflection.md
          - "17. The lens equation": guide/17-lens-equation.md
          - "18. Magnification & caustics": guide/18-magnification.md
          - "19. The Einstein radius": guide/19-einstein-radius.md
          - "20. SIS, SIE, EPL — what gamma means": guide/20-profiles.md
          - "21. Degeneracies": guide/21-degeneracies.md
      - "Part V — This repo's science, decoded":
          - "22. Lens modelling as inference": guide/22-inference.md
          - "23. HMC, SMC & flows": guide/23-samplers.md
          - "24. The correlated-noise likelihood": guide/24-correlated-noise.md
          - "25. Spine 1 — the 191-nat flip": guide/25-money-number.md
          - "26. Spine 2 — the saddle": guide/26-the-saddle.md
      - "Part VI — Discovery":
          - "27. Finding lenses & the resolution wall": guide/27-discovery.md
          - "28. The label is the problem": guide/28-the-label.md
      - "Part VII — Synthesis":
          - "29. Where the frontier is": guide/29-how-to-read.md
  - Current:
      - LensJudge: current/lensjudge/index.md
      - LensJudge — Honest Residuals: current/lensjudge-residual/index.md
      - LensJudge — Human Baseline: current/lensjudge-human-baseline/index.md
      - LensJudge — Human Parity: current/lensjudge-parity/index.md
      - ClaudeNet: current/claudenet/index.md
      - ClaudeNet DR10 Lens Rediscoveries: current/claudenet-new-candidates/index.md
      - DR11 Lens Search: current/dr11-campaign/index.md
      - Claude-GIGA-Lens: current/claude-giga-lens/index.md
      - Redshifty: current/redshifty/index.md
  - ClaudeNet v4 Work: claudenet-v4/index.md
  - Reproductions:
      - AION-1: reproductions/aion-1/index.md
      - Cikota 2023: reproductions/cikota-2023/index.md
      - Dawes 2022: reproductions/dawes-2022/index.md
      - Foundry I: reproductions/foundry-i/index.md
      - Foundry I Evolution: reproductions/foundry-i-evolution/index.md
      - Foundry II: reproductions/foundry-ii/index.md
      - Foundry III: reproductions/foundry-iii/index.md
      - Foundry IV: reproductions/foundry-iv/index.md
      - Gu 2022: reproductions/gu-2022/index.md
      - Hsu 2025: reproductions/hsu-2025/index.md
      - Huang 2020: reproductions/huang-2020/index.md
      - Huang 2021: reproductions/huang-2021/index.md
      - Inchausti 2025: reproductions/inchausti-2025/index.md
      - Sheu 2023: reproductions/sheu-2023/index.md
      - Sheu 2024a: reproductions/sheu-2024a/index.md
      - Sheu 2024b: reproductions/sheu-2024b/index.md
      - Silver 2025: reproductions/silver-2025/index.md
  - Other:
      - Apple Silicon:
          - Overview: other/apple-silicon/index.md
          - Huang 2020 port: other/apple-silicon/huang-2020.md
          - Huang 2021 port: other/apple-silicon/huang-2021.md
          - Redshifty port: other/apple-silicon/redshifty.md
      - DESI DR11 Cutouts: other/desi-dr11-cutouts/index.md
